<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    <h1>Available Places</h1>
    <main>
        <div id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">All</option>
            </select>
        </div>

        <section id="places-list">
            <div class="place-card">
                <h2>Cozy Cabin</h2>
                <img src="./images/cozy_cabin.jpg" alt="Cozy cabin">
                <p>Price per night: $60</p>
                <button class="details-button">View Details</button>
            </div>

            <div class="place-card">
                <h2>Downtown Loft</h2>
                <img src="./images/downtown_loft.jpg" alt="Downtown loft">
                <p>Price per night: $120</p>
                <button class="details-button">View Details</button>
            </div>

            <div class="place-card">
                <h2>Beachside Bungalow</h2>
                <img src="./images/beachside_bungalow.jpg" alt="Beachside bungalow">
                <p>Price per night: $90</p>
                <button class="details-button">View Details</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
