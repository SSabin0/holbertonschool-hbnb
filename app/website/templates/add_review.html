<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="images/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="/static/images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <h1>Your review is appreciated!</h1>
<section class="add-review">
    <h2>Add a Review</h2>
    <p class="form-subtext">Share your experience with this place. Your review helps other guests.</p>
    <form id="review-form" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="reviewer-name">Name <span class="required">*</span></label>
                <input type="text" id="reviewer-name" name="reviewer-name" required>
            </div>
            <div class="form-group">
                <label for="rating">Rating <span class="required">*</span></label>
                <select id="rating" name="rating" required>
                    <option value="" disabled selected>Select a rating</option>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Good</option>
                    <option value="3">3 - Average</option>
                    <option value="2">2 - Poor</option>
                    <option value="1">1 - Terrible</option>
                </select>
            </div>
        </div>

        <div class="form-group full-width">
            <label for="review-text">Review <span class="required">*</span></label>
            <textarea id="review-text" name="review-text" required></textarea>
        </div>

        <p class="required-note"><span class="required">*</span> Required Fields</p>

        <button type="submit" class="details-button">Submit</button>
    </form>
</section>
    </main>
    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="/static/scripts.js"></script>
</body>
</html>
